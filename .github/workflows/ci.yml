name: CI
on:
  push:
  pull_request:
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[demo,test]'
      - name: Test
        run: python -m pytest -q
      - name: Theory demo
        run: python demo/theory.py --output outputs/theory
      - name: Arithmetic demo smoke test
        run: python demo/demo.py --warmup 5 --no-plot --output outputs/demo
